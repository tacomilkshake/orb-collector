name: Tested container release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'
permissions:
  contents: read
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: {"include": [{"image": "orb-collector", "variant": "default", "alias": "main", "file": "Dockerfile", "context": "."}]}
    env:
      IMAGE: ghcr.io/tacomilkshake/${{ matrix.image }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test source
        run: true
      - name: Build candidate once
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
          DOCKERFILE: ${{ matrix.file }}
          CONTEXT: ${{ matrix.context }}
        run: |
          docker build --pull --file "$DOCKERFILE"             --label "org.opencontainers.image.source=$SOURCE_URL"             --label "org.opencontainers.image.revision=$REVISION"             --label "org.opencontainers.image.version=$REVISION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"             --tag candidate:test "$CONTEXT"
      - name: Test candidate
        run: ci/test-image.sh candidate:test
      - name: Scan candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: candidate:test
          format: json
          output: vulnerabilities.json
          exit-code: '0'
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Reject fixable high and critical vulnerabilities
        run: |
          python3 - <<'PYSCAN'
          import json
          report=json.load(open('vulnerabilities.json'))
          blocked=[v for result in report.get('Results',[]) for v in result.get('Vulnerabilities',[])
                   if v.get('Severity') in ('HIGH','CRITICAL') and v.get('FixedVersion')]
          for item in blocked:
              print(item['VulnerabilityID'], item['PkgName'], item['InstalledVersion'], 'fixed:', item['FixedVersion'])
          if blocked: raise SystemExit('Fix high and critical vulnerabilities before publishing')
          PYSCAN
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerabilities-${{ matrix.image }}-${{ matrix.variant }}
          overwrite: true
          path: vulnerabilities.json
          if-no-files-found: warn
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ALIAS: ${{ matrix.alias }}
        run: |
          set -euo pipefail
          release="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$VARIANT"
          if docker manifest inspect "$release" >/dev/null 2>&1; then
            echo "Refusing to replace an existing release: $release" >&2
            exit 1
          fi
          tested_id=$(docker image inspect candidate:test --format '{{.Id}}')
          docker tag candidate:test "$release"
          docker push "$release"
          docker pull "$release"
          test "$(docker image inspect "$release" --format '{{.Id}}')" = "$tested_id"
          docker tag "$release" "$IMAGE:$ALIAS"
          docker push "$IMAGE:$ALIAS"
          digest=$(docker image inspect "$release" --format '{{index .RepoDigests 0}}')
          printf '%s\n' "Release: $release" "Digest: $digest" "Tested image: $tested_id" > release.txt
          cat release.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.image }}-${{ matrix.variant }}
          overwrite: true
          path: release.txt
